name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [ubuntu-ci, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          python3 -m py_compile knatd tests/test_knatd.py
          sh -n install.sh
      - name: Run tests
        run: python3 -m unittest -v tests/test_knatd.py
      - name: Check reference configuration
        run: ./knatd -c examples check
