# Four-column forwarding format:
# bind_address bind_port[/protocol] target_address target_port[/protocol] [options]

# TCP: 0.0.0.0:8080 -> 10.0.0.2:80
# 0.0.0.0 8080 10.0.0.2 80

# UDP: 0.0.0.0:5353 -> 10.0.0.53:53
# 0.0.0.0 5353/udp 10.0.0.53 53/udp

# Bind one public address and use a fixed outbound source address.
# 192.0.2.10 8443/tcp 10.0.0.3 443/tcp [src=10.0.0.1]
